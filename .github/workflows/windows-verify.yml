name: Windows installer verification
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Windows release build run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gaon-erp-windows-x64
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Install, inspect and uninstall
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'GAON-Installer-Verification'
          $setup = (Resolve-Path 'GAON-ERP-Setup-x64.exe').Path
          $install = Start-Process -FilePath $setup -ArgumentList '/S',("/D=" + $installDir) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $exe = Join-Path $installDir 'GAON ERP.exe'
          $asar = Join-Path $installDir 'resources/app.asar'
          $pdf = Join-Path $installDir 'resources/GAON-ERP-Quickstart.pdf'
          foreach ($path in @($exe,$asar,$pdf)) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Installed file missing: $path" }
          }
          $version = (Get-Item -LiteralPath $exe).VersionInfo.ProductVersion
          if ($version -ne '0.2.0.0') { throw "Installed product version mismatch: $version" }
          $client = $null
          $clientStarted = $false
          try {
            $client = Start-Process -FilePath $exe -PassThru
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              $client.Refresh()
              if ($client.HasExited) { throw "Installed app exited before showing its window: $($client.ExitCode)" }
              if ($client.MainWindowHandle -ne 0 -and $client.MainWindowTitle -eq 'GAON ERP') {
                $clientStarted = $true
                break
              }
            }
            if (-not $clientStarted) { throw 'Installed app did not show the GAON ERP window within 15 seconds' }
            Write-Host 'Installed app launch verified: GAON ERP window is visible'
          }
          finally {
            if ($null -ne $client -and -not $client.HasExited) {
              [void]$client.CloseMainWindow()
              if (-not $client.WaitForExit(5000)) {
                Stop-Process -Id $client.Id -Force
                $client.WaitForExit()
              }
            }
          }
          $uninstaller = @(Get-ChildItem -LiteralPath $installDir -Filter '*Uninstall*.exe')
          if ($uninstaller.Count -ne 1) { throw 'Uninstaller missing or ambiguous' }
          $uninstall = Start-Process -FilePath $uninstaller[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed: $($uninstall.ExitCode)" }
          for ($i = 0; $i -lt 20 -and (Test-Path -LiteralPath $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path -LiteralPath $exe) { throw 'App remains after uninstall' }
          $result = @{ installerExit = $install.ExitCode; uninstallerExit = $uninstall.ExitCode; version = $version; installedClient = $true; installedClientLaunched = $clientStarted; installedManual = $true; removedClient = $true; platform = 'Windows x64' }
          $result | ConvertTo-Json | Tee-Object -FilePath 'windows-installer-verification.json'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-verification
          path: windows-installer-verification.json
          retention-days: 7
          if-no-files-found: error
